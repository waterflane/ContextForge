[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[project]
name = "contextforge-cli"
dynamic = ["version"]
description = "Build bounded, reviewable repository context for coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "waterflane" }
]
keywords = [
  "ai",
  "coding-agents",
  "context",
  "developer-tools",
  "repository-intelligence",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "pathspec>=0.12.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "rich>=13.9.0,<16.0.0",
  "typer>=0.16.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "mypy>=1.16.0,<2.0.0",
  "pytest>=8.4.0,<9.0.0",
  "pytest-cov>=6.0.0,<7.0.0",
  "ruff>=0.12.0,<1.0.0",
  "uvicorn>=0.52.1,<1.0.0",
]
release = [
  "build>=1.2.2,<2.0.0",
  "check-wheel-contents>=0.6.1,<1.0.0",
  "cyclonedx-bom>=6.0.0,<8.0.0",
  "pip-audit>=2.9.0,<3.0.0",
  "pip-licenses>=5.0.0,<6.0.0",
  "twine>=6.1.0,<7.0.0",
]

[project.urls]
Homepage = "https://github.com/waterflane/ContextForge"
Repository = "https://github.com/waterflane/ContextForge"
Issues = "https://github.com/waterflane/ContextForge/issues"
Changelog = "https://github.com/waterflane/ContextForge/blob/main/CHANGELOG.md"
Documentation = "https://github.com/waterflane/ContextForge/wiki"
Security = "https://github.com/waterflane/ContextForge/security/policy"

[project.scripts]
contextforge = "contextforge.cli.main:run"
ctxf = "contextforge.cli.main:run"

[tool.hatch.version]
path = "src/contextforge/_metadata.py"

[tool.hatch.build]
skip-excluded-dirs = true
exclude = [
  "/.agents",
  "/.contextforge",
  "/.github",
  "/.pytest_cache",
  "/.pytest-tmp",
  "/.review-fixture",
  "/.ruff_cache",
  "/.mypy_cache",
  "/.vscode",
  "/.coverage",
  "/.coverage.*",
  "/docs/archive/plans",
  "/htmlcov",
  "/build",
  "/dist",
  "/tests",
  "/uv.lock",
  "/wiki",
  "**/*.tmp",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contextforge"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/pyproject.toml",
  "/src/contextforge",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=contextforge --cov-branch --cov-report=term-missing --cov-fail-under=90"
