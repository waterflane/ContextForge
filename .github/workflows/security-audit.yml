name: Security audit

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_LOCKED: "1"
  UV_NO_PROGRESS: "1"

jobs:
  dependencies:
    name: dependencies, licenses, and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.8.13"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked audit tools
        run: uv sync --extra release
      - name: Export and audit locked runtime dependencies
        run: |
          uv export --quiet --no-dev --no-emit-project --output-file runtime-requirements.txt
          uv run pip-audit --strict --requirement runtime-requirements.txt
      - name: Create runtime license inventory and SBOM
        run: |
          uv venv .runtime-venv
          uv pip install --python .runtime-venv/bin/python --requirement runtime-requirements.txt
          uv pip install --python .runtime-venv/bin/python --no-deps .
          .runtime-venv/bin/python scripts/generate_license_inventory.py license-inventory.json
          uv run cyclonedx-py environment .runtime-venv/bin/python --output-format JSON --output-file sbom.cdx.json
      - name: Upload audit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-audit-reports
          path: |
            license-inventory.json
            runtime-requirements.txt
            sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Run Gitleaks without comments or PR creation
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
