name: Feature request
description: Propose a focused improvement to ContextForge
title: "Feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the problem before proposing an implementation. Large changes
        should be discussed and accepted before code is written.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing Issues and the roadmap.
          required: true
        - label: I removed private repository data and credentials.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome and public behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or smaller options have you considered?
  - type: textarea
    id: scope
    attributes:
      label: Scope boundaries
      description: What should this request intentionally not change?
